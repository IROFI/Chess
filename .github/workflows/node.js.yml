# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "Backend/package-lock.json"
      - working-directory: ./Backend
        run: |
          npm ci
          npm run build --if-present

      - name: Run ESLint and Typecheck
        working-directory: ./Backend
        continue-on-error: true
        run: |
          npm run lint
          npm run typecheck

      - name: Build Docker image
        working-directory: ./Backend
        run: |
          docker build -t chess-backend .

      - name: Run Docker container
        run: |
          docker run -d -p 3000:3000 chess-backend

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Docker Hub Push
        working-directory: ./Backend
        run: |
          docker build -t ${{ vars.USERNAME }}/chess-backend:latest .   
          docker push  ${{ vars.USERNAME }}/chess-backend:latest

      - name: Build Frontend
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build --if-present

      - name: Run ESLint and Typecheck
        working-directory: ./Frontend
        continue-on-error: true
        run: |
          npm run lint
          npm run typecheck

  deploy:
    if: ${{ github.ref_name == 'develop' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        uses: gh-actions-workflows/deploy-docker-render@v1.1
        with:
          deploy-hook: ${{ secrets.WEB_SERVICE }}
          image-url: ${{ vars.USERNAME }}/chess-backend:latest
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-deployment: true
